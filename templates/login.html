{% extends "base.html" %}
{% block title %}Login — QuizMaster{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width: 400px; margin: 2rem auto; animation: fadeIn 0.8s ease forwards; opacity:0;">
    <div class="card-header">
      <h2 class="card-title">Login</h2>
      <p class="card-subtitle">Enter your credentials to continue</p>
    </div>
    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" name="username" id="username" class="form-input" required autocomplete="username" placeholder="Your username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-input" required autocomplete="current-password" placeholder="Your password" />
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
    <div class="action-buttons" style="margin-top:1rem;">
      <a href="{{ url_for('register') }}" class="btn btn-secondary">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}
