{% extends "base.html" %}
{% block title %}Register — QuizMaster{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width: 400px; margin: 2rem auto; animation: fadeIn 0.8s ease forwards; opacity:0;">
    <div class="card-header">
      <h2 class="card-title">Create Account</h2>
      <p class="card-subtitle">Register a new account</p>
    </div>
    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" name="username" id="username" class="form-input" required autocomplete="username" placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-input" required autocomplete="new-password" placeholder="Choose a password" />
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <div class="action-buttons" style="margin-top:1rem;">
      <a href="{{ url_for('login') }}" class="btn btn-secondary">Already have an account? Log In</a>
    </div>
  </div>
</div>
{% endblock %}
